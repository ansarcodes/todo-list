<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo list</title>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-title-container">
            <div class="sidebar-title">Projects</div>
            <div class="add-project">
                <button id="add-project-btn" popovertarget="add-project-dialog">+</button>
            </div>
        </div>
        <div class="project-list"></div>
    </div>
    <div class="main-container">
    </div>
    <div class="dialog-container">
        <dialog id="add-project-dialog" popover>
            <button popovertarget="add-project-dialog" popovertargetaction="hide" class="close-dialog-btn" type="button">X</button>        
            <form action="" id="add-project-dialog-form">
                <div class="new-project-title">
                    <label for="new-project-title">Title:</label>
                    <input type="text" name="new-project-title" id="new-project-title">
                </div>
                <button id="add-new-project-btn">Add project</button>
            </form>
        </dialog>
        <dialog id="project-add-todo-dialog" popover>
            <button popovertarget="project-add-todo-dialog" popovertargetaction="hide" class="close-dialog-btn" type="button">X</button>
        </dialog>
    </div>
</body>
</html>
