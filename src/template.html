<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo list</title>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-title-container">
            <div class="sidebar-title">Projects</div>
            <div class="add-project">
                <button id="add-project-btn" popovertarget="add-project-dialog">
                    <img src="./images/add_icon.png" alt="add-plus-icon" class="add-icon">
                </button>
            </div>
        </div>
        <div class="project-list"></div>
    </div>
    <div class="main-container">
    </div>
    <div class="dialog-container">
        <dialog id="add-project-dialog" popover>
            <button popovertarget="add-project-dialog" popovertargetaction="hide" class="close-dialog-btn" type="button">X</button>        
            <form action="" id="add-project-dialog-form">
                <div class="new-project-title">
                    <label for="new-project-title">Title:</label>
                    <input type="text" name="new-project-title" id="new-project-title">
                </div>
                <button id="add-new-project-btn">Add project</button>
            </form>
        </dialog>
        <dialog id="edit-project-dialog">
            <button command="close" commandFor="edit-project-dialog" class="close-dialog-btn" type="button">X</button>        
            <form action="" id="edit-project-dialog-form">
                <div class="edit-project-title">
                    <label for="edit-project-title">Title:</label>
                    <input type="text" name="edit-project-title" id="edit-project-title">
                </div>
                <button id="edit-project-btn">Rename project</button>
            </form>
        </dialog>
        <dialog id="project-add-todo-dialog">
            <button command="close" commandFor="project-add-todo-dialog" class="close-dialog-btn" type="button">X</button>
            <form action="" id="project-add-todo-form">
                <div class="new-todo-title">
                    <label for="new-todo-title">Title:</label>
                    <input type="text" name="new-todo-title" id="new-todo-title">
                </div>
                <div class="new-todo-description">
                    <label for="new-todo-description">Description:</label>
                    <input type="text" name="new-todo-description" id="new-todo-description">
                </div>
                <div class="new-todo-due-date">
                    <label for="new-todo-due-date">Due date:</label>
                    <input type="date" name="new-todo-due-date" id="new-todo-due-date">
                </div>
                <div class="new-todo-priority">
                    <label for="new-todo-priority">Priority:</label>
                    <select name="new-todo-priority" id="new-todo-priority">
                        <option value="Low">Low</option>
                        <option value="Mid">Mid</option>
                        <option value="High">High</option>
                    </select>
                </div>
                <button id="project-add-new-todo-btn">Add</button>
            </form>
        </dialog>
        <dialog id="edit-todo-dialog">
            <button command="close" commandFor="edit-todo-dialog" class="close-dialog-btn" type="button">X</button>
            <form action="" id="edit-todo-form">
                <div class="edit-todo-title">
                    <label for="edit-todo-title">Title:</label>
                    <input type="text" name="edit-todo-title" id="edit-todo-title">
                </div>
                <div class="edit-todo-description">
                    <label for="edit-todo-description">Description:</label>
                    <input type="text" name="edit-todo-description" id="edit-todo-description">
                </div>
                <div class="edit-todo-due-date">
                    <label for="edit-todo-due-date">Due date:</label>
                    <input type="date" name="edit-todo-due-date" id="edit-todo-due-date">
                </div>
                <div class="edit-todo-priority">
                    <label for="edit-todo-priority">Priority:</label>
                    <select name="edit-todo-priority" id="edit-todo-priority">
                        <option value="Low">Low</option>
                        <option value="Mid">Mid</option>
                        <option value="High">High</option>
                    </select>
                </div>
                <button id="edit-todo-btn">Edit</button>
            </form>
        </dialog>
        <dialog id="remove-todo-dialog">
            <button command="close" commandFor="remove-todo-dialog" class="close-dialog-btn" type="button">X</button>        
            <form action="" id="remove-todo-form">
                <div class="remove-todo-title">Are you sure?</div>
                <div class="remove-todo-btns">
                    <button id="remove-todo-btn">Yes</button>
                    <button id="cancel-remove-todo-btn" command="close" commandFor="remove-todo-dialog" type="button">Cancel</button>
                </div>
            </form>
        </dialog>
    </div>
</body>
</html>
